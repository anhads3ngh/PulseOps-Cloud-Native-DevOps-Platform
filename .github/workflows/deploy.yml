name: CD — build immutable image → ECR → AWS Lambda
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  id-token: write
  contents: read
concurrency:
  group: pulseops-production-demo
  cancel-in-progress: false
jobs:
  deploy:
    name: Deploy verified SHA image
    runs-on: ubuntu-latest
    if: ${{ vars.ECR_REPOSITORY_URI != '' }}
    environment: demo
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ca-central-1
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Push immutable architecture-specific Lambda image
        env:
          ECR: ${{ vars.ECR_REPOSITORY_URI }}
        run: |
          test -n "$ECR"
          docker buildx build --platform linux/amd64 --provenance=false \
            -f Dockerfile.lambda -t "$ECR:${GITHUB_SHA}" --push .
      - name: Update both functions and await readiness
        env:
          ECR: ${{ vars.ECR_REPOSITORY_URI }}
        run: |
          set -euo pipefail
          for fn in pulseops-api pulseops-worker; do
            aws lambda update-function-code --function-name "$fn" \
              --image-uri "$ECR:${GITHUB_SHA}" --no-cli-pager >/dev/null
            aws lambda wait function-updated --function-name "$fn"
          done
      - name: Deployment summary
        run: echo "### Deployed ${GITHUB_SHA} to PulseOps Lambda API and Worker" >> "$GITHUB_STEP_SUMMARY"
